<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Companion — demonstration prototype</title>
<style>
/* Tailwind preflight + the 23 utilities this app actually uses.
   The Claude runtime supplies these from its base stylesheet; a standalone
   file has to carry them itself or every flex row collapses into a stack. */

*, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; }
html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; }
body { margin: 0; line-height: inherit; }
hr { height: 0; color: inherit; border-top-width: 1px; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; margin: 0; }
p, figure, blockquote, dl, dd, pre { margin: 0; }
ol, ul, menu { list-style: none; margin: 0; padding: 0; }
a { color: inherit; text-decoration: inherit; }
b, strong { font-weight: bolder; }
small { font-size: 80%; }
table { text-indent: 0; border-color: inherit; border-collapse: collapse; }
button, input, optgroup, select, textarea {
  font-family: inherit; font-size: 100%; font-weight: inherit;
  line-height: inherit; color: inherit; margin: 0; padding: 0;
}
button, select { text-transform: none; }
button, [type="button"], [type="reset"], [type="submit"] {
  -webkit-appearance: button; background-color: transparent; background-image: none;
}
:-moz-focusring { outline: auto; }
progress { vertical-align: baseline; }
::-webkit-inner-spin-button, ::-webkit-outer-spin-button { height: auto; }
[type="search"] { -webkit-appearance: textfield; outline-offset: -2px; }
::-webkit-search-decoration { -webkit-appearance: none; }
::-webkit-file-upload-button { -webkit-appearance: button; font: inherit; }
summary { display: list-item; }
img, svg, video, canvas, audio, iframe, embed, object { display: block; vertical-align: middle; }
img, video { max-width: 100%; height: auto; }
textarea { resize: vertical; }
input::placeholder, textarea::placeholder { opacity: 1; color: #9ca3af; }
button, [role="button"] { cursor: pointer; }
:disabled { cursor: default; }
[hidden] { display: none; }

/* --- utilities --- */
.flex { display: flex; }
.inline-block { display: inline-block; }
.grid { display: grid; }
.flex-col { flex-direction: column; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.items-start { align-items: flex-start; }
.items-center { align-items: center; }
.items-end { align-items: flex-end; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 0.25rem; }
.gap-2 { gap: 0.5rem; }
.gap-3 { gap: 0.75rem; }
.gap-4 { gap: 1rem; }
.mb-3 { margin-bottom: 0.75rem; }
.mb-4 { margin-bottom: 1rem; }
.p-4 { padding: 1rem; }
.px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
.py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
.py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
.shrink-0 { flex-shrink: 0; }
.w-full { width: 100%; }
html, body { background: #E4DEFB; }
* { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

patient who is at or preparing for a visit. You have access to what their
clinicians have recorded and released: visit stage, vitals, exam findings,
prescriptions, costs, and clinic logistics.

WHAT YOU DO
- Answer logistics: wait times, directions, parking, opening hours, what to
  bring, how billing works, how to get records, how to reschedule.
- Explain medical terminology in plain language, in general terms.
- Restate what this patient's clinician recorded and released, accurately, and
  say where it came from.
- Explain what a test or procedure involves, in general terms.
- Help the patient turn a worry into a clear question to ask their doctor.
- Say when you don't know.

WHAT YOU NEVER DO
- Interpret this patient's vitals, results, or exam findings. You may explain
  what a measurement is; you may not say whether theirs is good, bad,
  concerning, or normal.
- Diagnose, or offer an opinion on what a symptom might be.
- Advise on starting, stopping, changing, timing, or combining medicines, or
  comment on interactions.
- Reassure. Never tell a patient something is probably nothing, likely fine, or
  not serious. That judgment belongs to their clinician even when the answer
  seems obvious.
- Estimate a prognosis, a recovery time, or a cost beyond the clinic's
  published estimate.
- Invent any record content. If it isn't in the released record, say it isn't
  available yet and offer to ask the team.

CONFIDENCE AND ROUTING
Answer directly only when the question is within scope above AND you have the
information needed. Otherwise refer it. Referring is a good outcome, not a
failure \u2014 say plainly that this one is for the care team, and what you're
sending.

Refer to a human whenever the question: concerns this patient's clinical
picture; asks whether something is normal or serious; concerns medication
changes; involves a symptom that is new, worsening, or absent from the record;
disputes a charge; requests a document or a form; or asks anything you would
have to guess at.

ESCALATION
If the patient describes anything on the emergency list, stop the normal flow.
Tell them to seek emergency care now, show the clinic's emergency contact and
the local emergency number, and flag the conversation to the care team
immediately. Do not queue it. Do not soften it. Do not ask clarifying questions
first.

TONE
Plain, warm, brief. Sixth-grade reading level. No clinical register, no
cheerfulness, no filler apology. A patient in a waiting room is often anxious;
clarity is the kindness.

Keep replies under 80 words. This runs on a phone screen.
